# Kodar: build on GitHub Actions, host on Vercel.
#
# Cal's Next.js build takes longer than the 45 minutes Vercel allows on its
# standard (Pro-included) build machine. This public fork gets free Actions
# minutes on a larger runner with no such limit, so the build happens here and
# the finished output is uploaded with `vercel deploy --prebuilt`. Vercel's own
# Git builds are switched off (project "Ignored Build Step" = `exit 0`).
#
# Runtime env vars stay on the Vercel project; only what the build itself
# needs is passed from repo secrets.
name: Deploy to Vercel

on:
  push:
    branches: [kodar]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: npm install -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # Sensitive vars come down as the literal "[SENSITIVE]" and would shadow the
      # real values passed below (Cal JSON-parses some of them at build time).
      - run: grep -vF '"[SENSITIVE]"' .vercel/.env.production.local > env.tmp && mv env.tmp .vercel/.env.production.local
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          # Sensitive Vercel env vars cannot be pulled, so the build gets them here.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
          GOOGLE_API_CREDENTIALS: ${{ secrets.GOOGLE_API_CREDENTIALS }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
